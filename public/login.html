<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocManager - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- App name at the top, links back to the home page -->
        <div class="text-center pt-5">
            <a href="/" class="h3 fw-bold text-primary text-decoration-none">DocManager</a>
        </div>

        <div class="card auth-card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-1">Login</h3>
                <p class="text-center text-muted mb-4">Welcome back to DocManager</p>

                <!-- Success / error messages will be shown here by JavaScript -->
                <div id="message"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Your password" required>
                    </div>

                    <button type="submit" id="loginButton" class="btn btn-primary w-100">Login</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Don't have an account? <a href="/signup.html">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Our JavaScript for this page (at the end, so all the HTML above already exists) -->
    <script src="/js/login.js"></script>

</body>
</html>
