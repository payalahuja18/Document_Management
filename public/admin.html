<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocManager - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar (dark, so the admin page looks different) -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin.html">DocManager <span class="badge bg-warning text-dark">Admin</span></a>
            <div>
                <a href="/dashboard.html" class="btn btn-outline-light btn-sm">My dashboard</a>
                <button id="logoutButton" class="btn btn-light btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">

        <div class="mb-4">
            <h3 class="mb-0">All documents</h3>
            <p id="documentCount" class="text-muted mb-0">Documents uploaded by all users</p>
        </div>

        <!-- Success / error messages -->
        <div id="message"></div>

        <!-- Documents table -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Document name</th>
                                <th>Category</th>
                                <th>Owner</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <!-- JavaScript will fill this tbody with one row per document -->
                        <tbody id="adminTableBody">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">Loading documents...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Our JavaScript for this page (at the end, so all the HTML above already exists) -->
    <script src="/js/admin.js"></script>

</body>
</html>
