<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocManager - Upload</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard.html">DocManager</a>
            <div>
                <a href="/dashboard.html" class="btn btn-light btn-sm">Back to dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card form-card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-1">Upload a document</h3>
                <p class="text-muted mb-4">Allowed: pdf, jpg, jpeg, png, doc, docx (max 5 MB)</p>

                <!-- Success / error messages -->
                <div id="message"></div>

                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="documentName" class="form-label">Document name</label>
                        <input type="text" id="documentName" class="form-control" placeholder="e.g. My Resume 2026" required>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select id="category" class="form-select" required>
                            <option value="">Select a category</option>
                            <option value="Resume">Resume</option>
                            <option value="Certificate">Certificate</option>
                            <option value="College Document">College Document</option>
                            <option value="Assignment">Assignment</option>
                            <option value="Notes">Notes</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="file" class="form-label">File</label>
                        <input type="file" id="file" class="form-control" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" required>
                    </div>

                    <button type="submit" id="uploadButton" class="btn btn-primary w-100">Upload</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Our JavaScript for this page (at the end, so all the HTML above already exists) -->
    <script src="/js/upload.js"></script>

</body>
</html>
