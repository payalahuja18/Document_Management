<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocManager - Sign up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- App name at the top, links back to the home page -->
        <div class="text-center pt-5">
            <a href="/" class="h3 fw-bold text-primary text-decoration-none">DocManager</a>
        </div>

        <div class="card auth-card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-1">Create account</h3>
                <p class="text-center text-muted mb-4">Start managing your documents</p>

                <!-- Success / error messages will be shown here by JavaScript -->
                <div id="message"></div>

                <form id="signupForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Your full name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Choose a password" required>
                    </div>

                    <button type="submit" id="signupButton" class="btn btn-primary w-100">Sign up</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Already have an account? <a href="/login.html">Login</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Our JavaScript for this page (at the end, so all the HTML above already exists) -->
    <script src="/js/signup.js"></script>

</body>
</html>
