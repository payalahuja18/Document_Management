<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocManager - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard.html">DocManager</a>
            <div>
                <!-- Hidden by default. JavaScript shows it only for Admins -->
                <a href="/admin.html" id="adminLink" class="btn btn-warning btn-sm d-none">Admin panel</a>
                <button id="logoutButton" class="btn btn-light btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">

        <!-- Welcome message + upload button -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
            <div>
                <h3 id="welcomeMessage" class="mb-0">Welcome</h3>
                <p id="documentCount" class="text-muted mb-0">Here are your documents</p>
            </div>
            <a href="/upload.html" class="btn btn-primary">+ Upload document</a>
        </div>

        <!-- Search + category filter -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-8">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search by document name...">
                    </div>
                    <div class="col-md-4">
                        <select id="categoryFilter" class="form-select">
                            <option value="">All categories</option>
                            <option value="Resume">Resume</option>
                            <option value="Certificate">Certificate</option>
                            <option value="College Document">College Document</option>
                            <option value="Assignment">Assignment</option>
                            <option value="Notes">Notes</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Success / error messages -->
        <div id="message"></div>

        <!-- Documents table -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Document name</th>
                                <th>Category</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <!-- JavaScript will fill this tbody with one row per document -->
                        <tbody id="documentTableBody">
                            <tr>
                                <td colspan="3" class="text-center text-muted py-4">Loading documents...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Our JavaScript for this page (at the end, so all the HTML above already exists) -->
    <script src="/js/dashboard.js"></script>

</body>
</html>
